[project]
name = "cognee-community-connector-opensiro-vsm"
version = "0.1.0"
description = "Read-only, pinned OpenSiro VSM assessment source and typed Cognee graph projection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/opensiro/upstream"
Repository = "https://github.com/opensiro/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_opensiro_vsm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
